# Runs the test suite on every push and pull request, so a regression is
# caught on GitHub before it reaches the VPS. No secrets needed: the tests
# use a throwaway SQLite file and an ephemeral local port (tests/helpers.js).
name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite needs Node >= 22.5 (see package.json "engines").
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
