# nginx site config for suivipro.info, reverse-proxying to the Node app.
# Used instead of Caddy because this VPS's nginx already owns port 443 for
# another site — nginx can host multiple domains on the same port via
# server blocks (routes by Host header / SNI), so this doesn't disturb
# whatever else is already running.
#
# Install: copy this to /etc/nginx/sites-available/suivipro.info, symlink
# into sites-enabled, then run certbot (see deploy/README.md step-by-step).

server {
    listen 80;
    listen [::]:80;
    server_name suivipro.info;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# certbot's --nginx plugin rewrites the block above (adds listen 443 ssl,
# ssl_certificate directives, and an HTTP->HTTPS redirect) automatically —
# no need to hand-write the HTTPS server block, see deploy/README.md.
